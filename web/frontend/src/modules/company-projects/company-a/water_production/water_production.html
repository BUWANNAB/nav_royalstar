<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bootstrap Icons 示例</title>

<title>个人信息列表</title>
<link rel="stylesheet" href="../../../../libs/bootstrap//css/bootstrap-icons.css">
<!-- 引入Bootstrap CSS -->
<link href="../../../../libs/bootstrap//css5.0/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./css/index.css">
<!-- 引入 xlsx 库 -->
<script src="../../../../libs/bootstrap//js5.0/xlsx.full.min.js"></script>

</head>
<body>
<div class="containers">
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-3 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5>当前站点最新状况数据:</h5>
                    </div>
                    <div class="card-body">
                        <form id="filterForm">
                            <div class="input-group mb-3">
                                <input type="text" class="form-control" placeholder="输入站点名称" id="siteNameFilter">
                                <button type="button" class="btn btn-primary me-2" id="queryButton">查询</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-4">
                <div class="card data-card bg-light-blue">
                    <div class="card-body">
                        <h5 class="card-title" >站点名</h5>
                        <p class="card-text" id="currentStationName"><i class="bi bi-geo-alt icon-large"></i></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-4">
                <div class="card data-card bg-light-gray">
                    <div class="card-body">
                        <h5 class="card-title" >时间</h5>
                        <p class="card-text" id="currentTime"><i class="bi bi-clock icon-large"></i></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-4">
                <div class="card data-card bg-light-green">
                    <div class="card-body">
                        <h5 class="card-title" >温度</h5>
                        <p class="card-text" id="currentTemp"><i class="bi bi-thermometer-half icon-large"></i></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-4">
                <div class="card data-card bg-light-yellow">
                    <div class="card-body">
                        <h5 class="card-title">pH值</h5>
                        <p class="card-text"  id="currentPh"><i class="bi bi-eyedropper icon-large"></i></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-4">
                <div class="card data-card bg-light-pink">
                    <div class="card-body">
                        <h5 class="card-title" >溶解氧</h5>
                        <p class="card-text" id="currentO2"><i class="bi bi-droplet-half icon-large"></i></p>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="row1">
        <div class="col-md-6 offset-md-3">
            <h3 class="mb-4">水质检测历史信息:</h3>
            <form id="filterForm2">
                <div class="input-group mb-3">
                    <span class="input-group-text">站点名称</span>
                    <input type="text" class="form-control" placeholder="输入站点名称" id="siteNameFilter2">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text">时间</span>
                    <input type="date" class="form-control" id="timeFilter2">
                </div>
                <button type="button" class="btn btn-primary me-2" id="filterButton">筛选</button>
                <button type="button" class="btn btn-secondary me-2" id="resetButton">重置</button>
                <button type="button" class="btn btn-success" id="exportButton">导出筛选结果Excel</button>
            </form>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>站点名</th>
                        <th>溶解氧</th>
                        <th>pH值</th>
                        <th>温度℃</th>
                        <th>时间</th>
                    </tr>
                </thead>
                <tbody id="infoList">
                    <!-- 数据将在这里动态加载 -->
                </tbody>
            </table>
            <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center" id="pagination">
                    <!-- 分页按钮将在这里动态生成 -->
                </ul>
            </nav>
        </div>
    </div>
</div>
<!-- 引入Bootstrap JS 和 Popper.js -->

<script src="../.../../../../../libs/bootstrap/js5.0/popper.min.js"></script>
<script src="../.../../../../../libs/bootstrap/js5.0/bootstrap.min.js"></script>
<script type="module" src="./js/index.js"></script>

</script>
</body>
</html>
