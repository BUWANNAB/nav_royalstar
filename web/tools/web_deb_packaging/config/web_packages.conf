# =============================================================================
# packages.conf — robot-system deb 打包配置
# 由 scripts/*.sh 通过 source 加载
#
# 参照 IPC_Web_service_deb/tools/web_deb_packaging/config/web_packages.conf
# =============================================================================

# ---------- 全局版本信息 ----------
DEB_VERSION="1.0.0"            # 与 pom.xml 的 <version> 保持一致
DEB_RELEASE="0jammy"           # 发行版后缀（Ubuntu 22.04 = jammy）
DEB_ARCH="amd64"

# ---------- 目录 ----------
# 本文件位于 <web 仓库根>/tools/web_deb_packaging/config/
PROJECT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"          # tools/web_deb_packaging
WEB_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/../../.." && pwd)"            # Web 仓库根（web/）
WEB_SRC_DIR="${WEB_ROOT}/backend"                                          # Java 源码目录
DELIVERABLE_DIR="${WEB_ROOT}/deploy"                                       # 交付区；安装脚本与素材（db、no_network_packages）在 deploy/install/ 下
WORK_ROOT="${PROJECT_DIR}/work"                                         # 构建工作区
OUTPUT_DIR="${PROJECT_DIR}/output"                                      # deb 输出目录

# ---------- 业务服务信息 ----------
WEB_DEB_NAME="robot-system"                 # dpkg 包名
WEB_INSTALL_DIR="/opt/blueant/robot"        # deb 安装路径
JAR_NAME="RobotSystem-${DEB_VERSION}.jar"   # spring-boot-maven-plugin 产出的可执行 jar
WEB_PORT="8088"

# ---------- 依赖声明 ----------
# 只声明 jar 运行所必需的最小依赖。
# ROS2 Humble 与 ~/ros2_java_ws 是环境前置条件，不由本 deb 负责
# （对齐参照项目「deb 仅用于环境已就绪机器」的决策）。
WEB_DEPENDS="openjdk-17-jre-headless"

WEB_DESCRIPTION="Rongshida AGV robot business system (Spring Boot backend + embedded web UI)"
